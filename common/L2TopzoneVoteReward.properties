# =============================================================================
# L2Topzone Vote Reward configuration
#
# Encoding: UTF-8. Non-ASCII characters in the Msg* keys below are read directly,
# no \uXXXX escaping needed.
#
# Every value is validated at boot. If something is out of range you get an
# explicit [L2Topzone] line in the server log instead of silent misbehaviour.
# =============================================================================

# API key from your server's dashboard: click the "API documentation" button
# (https://l2topzone.com/server/<your-server-id>/api-documentation).
# Treat as a secret — anyone with this key + your whitelisted IP can call the API.
ApiKey = REPLACE_WITH_YOUR_API_KEY

# API host. Leave as is. To test without a real key, keep this host and set
# ApiKey = sandbox_key (mock answers: IP 10.0.0.1 has voted, 10.0.0.2 has not).
ApiHost = https://api.l2topzone.com/v1

# In-game voiced command name (without leading dot).
# Comma-separate to register aliases, e.g.  VoiceCommand = vote, votar, rasplata
VoiceCommand = vote

# Cooldown per character before they can claim again (hours). 12h matches the API.
CooldownHours = 12

# Minimum character level allowed to claim. Raise it to blunt bot/alt farming.
MinPlayerLevel = 1

# =============================================================================
# Individual reward (granted on .vote command after a successful vote)
# Multiple items are comma-separated. Lists must be the same length and every
# id/count must be greater than zero.
# =============================================================================
IndividualRewardItemIds   = 57
IndividualRewardItemCount = 1000000

# =============================================================================
# Global reward (granted to all online players each time the server total
# crosses a milestone — e.g. every 100 votes). Set GlobalEnabled=false to skip.
# =============================================================================
GlobalEnabled         = true
GlobalVoteInterval    = 100
GlobalRewardItemIds   = 6673
GlobalRewardItemCount = 5
GlobalCheckMinutes    = 5

# How many seconds the global scheduler waits before its first run after boot.
GlobalInitialDelaySeconds = 60

# Safety cap: the most milestones that can be paid out in a single poll.
# Protects against a deleted store file or a toplist counter reset turning into
# a hundred-fold payout.
GlobalMaxMilestonesPerCheck = 5

# Whether characters parked in offline-shop mode also receive global rewards.
GlobalRewardOfflineTraders = false

# =============================================================================
# HWID protection
# Limits how many distinct characters from the same machine may be rewarded
# inside HwidWindowHours. Automatically inactive on packs that do not expose a
# HWID (logs one warning at boot); the per-character cooldown and the API's
# per-IP window still apply there.
# =============================================================================
HwidProtection      = true
MaxAccountsPerHwid  = 1
HwidWindowHours     = 12

# =============================================================================
# Player codes (optional)
# For players whose browser and game reach the internet from different IPs
# (mobile / fibre carriers with two exits), the IP check cannot find their vote.
# With player codes on, each character gets a personal vote link
# (.vote link) carrying a code. The reward check sends the IP and the code
# together; L2Topzone tries the IP first and the code only when the IP has no
# vote. The code is derived from your API key and the character id (nothing to
# store) and is only ever sent in a POST body.
#
# L2Topzone switches player codes on per server (ask by ticket). While they are
# off for your server the code is simply ignored and the classic IP check keeps
# working, so turning this on never breaks rewards.
# =============================================================================
PlayerCodeEnabled = false

# Your server's vote page, e.g. https://l2topzone.com/vote/id/12345
VoteUrl =

# =============================================================================
# Networking
# =============================================================================
# Per-request connect/read timeout in seconds. API calls never run on a game
# thread, but a lower value frees the worker sooner when the API is down.
HttpTimeoutSeconds = 5

# Maximum simultaneous API requests. Also caps how fast a .vote spam burst can
# hit the API (the published rate limit is 60 req/min).
MaxConcurrentRequests = 4

# =============================================================================
# Paths
# =============================================================================
# Where the cooldown/HWID state is persisted. Leave empty for the pack default
# (./config/L2TopzoneVoteReward.store). Give each world its own file when several
# gameservers share one directory.
StoreFile =

# UNIVERSAL BUILD ONLY. Root package of your pack, i.e. the part before
# ".gameserver" — e.g. com.l2jorion, com.l2jhellas, l2e. Leave empty: the
# universal build normally detects this by itself from the GameServer hook.
PackBasePackage =

# =============================================================================
# Misc
# =============================================================================
# Verbose logging (recommended during initial setup).
DebugLog = true

# =============================================================================
# Messages — delete a line to keep the English default.
# {time} renders as HH:MM:SS, {level} and {votes} as numbers.
# =============================================================================
MsgPrefix          = [L2Topzone]
MsgChecking        = Checking your vote, please wait...
MsgRewarded        = Thank you for voting! Your reward has been delivered.
MsgNoVote          = No vote found for your IP. Vote at https://l2topzone.com and try again.
MsgAlreadyRewarded = Your last vote was already rewarded. You can vote again in {time}.
MsgCooldown        = You can claim again in {time}.
MsgHwid            = A vote reward was already claimed from this machine.
MsgApiDown         = The vote service is unreachable right now. Please try again in a minute.
MsgApiError        = The vote service refused the request. Please contact an administrator.
MsgNoIp            = Could not resolve your IP address. Please relog and try again.
MsgBusy            = Too many vote checks in progress. Please try again in a few seconds.
MsgInProgress      = Your vote check is already running.
MsgInventoryFull   = Reward could not be delivered. Free some inventory space and try again.
MsgLowLevel        = You must be at least level {level} to claim vote rewards.
MsgGlobalReward    = The server reached {votes} total votes! Global reward delivered.
MsgReloaded        = Vote reward configuration reloaded.
MsgReloadFailed    = Reload failed — the config file is invalid. Previous settings kept.
# Player codes only. {link} is the character's personal vote link.
MsgVoteLink        = Your personal vote link: {link}
MsgNoVoteLink      = No vote found. Vote with your personal link and try again: {link}
